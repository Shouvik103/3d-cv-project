      const base=parseFloat(getComputedStyle(root).fontSize)||14;
      for(const item of labels) {
        const height=2*camera.position.distanceTo(item.sprite.position)*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*base*(item.heading?1.15:.95)*64/36/Math.max(1,stage.clientHeight);
        item.sprite.scale.set(height*3,height,1);
      }
      renderer.render(scene,camera);
    }
    function hideHover() {hover.hidden=true;highlight.visible=false;delete hover.dataset.triangle;}
    function preset() {hideHover();camera.position.fromArray(directions[view.value]).normalize().multiplyScalar(fitting);controls.target.set(0,0,0);controls.update();draw();}
    function setAppearance() {surface.material=materials[mode.value];axes.visible=axesInput.checked;hideHover();root.dataset.mode=mode.value;root.dataset.axes=String(axes.visible);draw();}
    function restore(saved) {
      const s=saved?.privateContent||saved;if(!s || s.scene!==data.scene)return false;
      if(materials[s.mode])mode.value=s.mode;if(directions[s.view])view.value=s.view;if(typeof s.axes==='boolean')axesInput.checked=s.axes;
      if(Array.isArray(s.eye)&&s.eye.length===3&&s.eye.every(Number.isFinite)&&Array.isArray(s.target)&&s.target.length===3&&s.target.every(Number.isFinite)) {camera.position.fromArray(s.eye);controls.target.fromArray(s.target);controls.update();} else preset();
      setAppearance();return true;
    }
    function save() {
      if(applying)return;
      window.openai?.setWidgetState?.({modelContent:{scene:data.title,representation:'triangle mesh',triangles:data.triangles,vertices:data.vertices,mode:mode.value,view:view.value,axes:axesInput.checked},privateContent:{scene:data.scene,mode:mode.value,view:view.value,axes:axesInput.checked,eye:camera.position.toArray(),target:controls.target.toArray()}})?.catch(()=>{});
    }
    function resize() {
      const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
      const vertical=THREE.MathUtils.degToRad(camera.fov),horizontal=2*Math.atan(Math.tan(vertical/2)*camera.aspect);
      fitting=geometry.boundingSphere.radius*1.25/Math.sin(Math.min(vertical,horizontal)/2);
      if(previousFit) camera.position.sub(controls.target).multiplyScalar(fitting/previousFit).add(controls.target);
      previousFit=fitting;controls.update();draw();
    }
    controls.addEventListener('change',()=>{draw();if(!applying){clearTimeout(timer);timer=setTimeout(save,200);}});
    controls.addEventListener('start',()=>{dragging=true;hideHover();});controls.addEventListener('end',()=>{dragging=false;});
    mode.addEventListener('change',()=>{setAppearance();status.textContent=mode.options[mode.selectedIndex].text;save();});
    axesInput.addEventListener('change',()=>{setAppearance();save();});
    view.addEventListener('change',()=>{applying=true;preset();applying=false;status.textContent=view.options[view.selectedIndex].text;save();});
    const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
    function pick() {
      if(!pointer || dragging)return;
      const r=renderer.domElement.getBoundingClientRect();ndc.set((pointer.x-r.left)/r.width*2-1,-(pointer.y-r.top)/r.height*2+1);
      camera.updateMatrixWorld();surface.updateMatrixWorld();raycaster.setFromCamera(ndc,camera);
      const hit=raycaster.intersectObject(surface,false)[0];
      if(!hit) {hideHover();draw();return;}
      const point=hit.point;[point.x,point.y,point.z].forEach((v,i)=>{values[i].textContent=(Math.abs(v)<.00005?0:v).toFixed(4);});
      faceLabel.textContent='Triangle '+(hit.faceIndex+1).toLocaleString();hover.dataset.triangle=String(hit.faceIndex);hover.hidden=false;
      highlightGeometry.getAttribute('position').array.set([point.x,point.y,point.z]);highlightGeometry.getAttribute('position').needsUpdate=true;highlight.visible=true;
      hover.style.left=Math.max(0,Math.min(r.width-hover.offsetWidth,pointer.x-r.left+14))+'px';hover.style.top=Math.max(0,Math.min(r.height-hover.offsetHeight,pointer.y-r.top+14))+'px';draw();
    }
    function queuePick() {
      if(hoverFrame || dragging)return;
      hoverFrame=requestAnimationFrame(function frame(now){if(now-lastHover<65){hoverFrame=requestAnimationFrame(frame);return;}hoverFrame=0;lastHover=now;pick();});
    }
    renderer.domElement.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};queuePick();});
    renderer.domElement.addEventListener('pointerleave',()=>{pointer=null;hideHover();draw();});
    renderer.domElement.addEventListener('pointerup',e=>{pointer={x:e.clientX,y:e.clientY};queuePick();});
    window.addEventListener('openai:set_globals',e=>{if(!e.detail?.globals?.widgetState)return;applying=true;restore(e.detail.globals.widgetState);applying=false;});
    new MutationObserver(()=>{theme();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{theme();draw();});
    applying=true;theme();resize();if(!restore(window.openai?.widgetState)){preset();setAppearance();}applying=false;
    new ResizeObserver(()=>{applying=true;resize();applying=false;}).observe(stage);
    root.dataset.ready='true';root.dataset.triangles=String(data.triangles);status.textContent='Mesh ready. All '+data.triangles.toLocaleString()+' triangles displayed.';
  } catch(error) {stage.setAttribute('role','alert');stage.textContent=error.message||String(error);status.textContent=String(error);}
})();
</script>
