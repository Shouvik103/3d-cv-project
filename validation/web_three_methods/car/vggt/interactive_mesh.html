    }
    function queuePick() {
      if(hoverFrame || dragging)return;
      hoverFrame=requestAnimationFrame(function frame(now){if(now-lastHover<65){hoverFrame=requestAnimationFrame(frame);return;}hoverFrame=0;lastHover=now;pick();});
    }
    renderer.domElement.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};queuePick();});
    renderer.domElement.addEventListener('pointerleave',()=>{pointer=null;hideHover();draw();});
    renderer.domElement.addEventListener('pointerup',e=>{pointer={x:e.clientX,y:e.clientY};queuePick();});
    window.addEventListener('openai:set_globals',e=>{if(!e.detail?.globals?.widgetState)return;applying=true;restore(e.detail.globals.widgetState);applying=false;});
    new MutationObserver(()=>{theme();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{theme();draw();});
    applying=true;theme();resize();if(!restore(window.openai?.widgetState)){preset();setAppearance();}applying=false;
    new ResizeObserver(()=>{applying=true;resize();applying=false;}).observe(stage);
    root.dataset.ready='true';root.dataset.triangles=String(data.triangles);status.textContent='Mesh ready. All '+data.triangles.toLocaleString()+' triangles displayed.';
  } catch(error) {stage.setAttribute('role','alert');stage.textContent=error.message||String(error);status.textContent=String(error);}
})();
</script>
